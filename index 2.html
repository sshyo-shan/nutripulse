      window.safeParseAiJson = (rawText) => {
        let clean = String(rawText || '').replace(/```json|```/gi, '').trim();
        const firstIdx = clean.search(/[\{\[]/);
        const lastBrace = clean.lastIndexOf('}');
        const lastBracket = clean.lastIndexOf(']');
        const lastIdx = Math.max(lastBrace, lastBracket);
        if (firstIdx !== -1 && lastIdx !== -1 && lastIdx > firstIdx) {
          clean = clean.slice(firstIdx, lastIdx + 1);
        }
        try {
          return JSON.parse(clean);
        } catch (e) {
          const repaired = clean.replace(
            /(:\s*")(.+?)("(?=\s*(?:,\s*"[a-zA-Z_]\w*"\s*:|\}|\])))/gs,
            (match, prefix, inner, suffix) => {
              const safeInner = inner.replace(/\\"/g, '«').replace(/"/g, '«');
              return prefix + safeInner + suffix;
            }
          );
          return JSON.parse(repaired);
        }
      };

        { id: 'emerald', group: 'dark', title: 'Изумруд', previewBg: '#0B100E', previewAccent: '#10B981' },

        { id: 'sky', group: 'light', title: 'Небесный', previewBg: '#DCE6F2', previewAccent: '#2563EB' },
        { id: 'latte', group: 'light', title: 'Латте', previewBg: '#EFE8DC', previewAccent: '#D97706' },
        { id: 'mint', group: 'light', title: 'Мята', previewBg: '#DCF0E6', previewAccent: '#059669' },
        { id: 'rose', group: 'light', title: 'Сакура', previewBg: '#F6E4EC', previewAccent: '#E11D48' }
      ];

      window.pairTheme = (id, group) => {
        const cur = window.THEME_PRESETS.find(x => x.id === id);
        if (cur && cur.group === group) return id;
        const pairs = { emerald: 'mint', ruby: 'rose', orange: 'latte', amethyst: 'sky' };
        if (group === 'light') return pairs[id] || 'sky';
        return Object.keys(pairs).find(k => pairs[k] === id) || 'emerald';
      };

      window.MASCOT_POOL = [
        {
          id: 'arnold',
          heroName: 'ARNOLD SCHWARZENEGGER',
          shortName: 'Арнольд (Терминатор на 30 дн.)',
          sadTitle: 'Уровень 0 • Начало пути',
          stage4Title: 'Золотая Эра «Pumping Iron»',
          olympiaTitle: '🤖 T-800 CYBERDYNE • 7x MR. OLYMPIA'

          id: 'ronnie',
          heroName: 'RONNIE COLEMAN',
          shortName: 'Ронни Коулмэн (King Ronnie)',
          sadTitle: 'Уровень 0 • Начало пути',
          stage4Title: 'Монстр массы «Yeah Buddy!»',

        {

        },
        {

          shortName: 'Мухаммед Али (The Greatest)',
          sadTitle: 'Уровень 0 • Начало пути',
          stage4Title: 'Порхай как бабочка, жаль как пчела',
          olympiaTitle: '🥊 THE GREATEST OF ALL TIME'
        }
      ];

      window.getLegendMascotStageInfo = (days, mascotId = 'arnold') => {
        const d = Math.max(0, Number(days) || 0);
        const mascot = window.MASCOT_POOL.find(m => m.id === mascotId) || window.MASCOT_POOL[0];

        if (d === 0) return { stage: 0, mascot, title: mascot.sadTitle, bottomNote: 'До финальной трансформации осталось 30 дн.' };
        if (d < 5) return { stage: 1, mascot, title: 'Первые шаги в зале', bottomNote: `До финальной формы осталось ${30 - d} дн.` };
        if (d < 10) return { stage: 2, mascot, title: 'Уверенный тонус мышц', bottomNote: `До финальной формы осталось ${30 - d} дн.` };
        if (d < 15) return { stage: 3, mascot, title: 'Мощный V-силуэт', bottomNote: `До финальной формы осталось ${30 - d} дн.` };
        if (d < 20) return { stage: 4, mascot, title: mascot.stage4Title, bottomNote: `До финальной формы осталось ${30 - d} дн.` };
        if (d < 30) return { stage: 5, mascot, title: 'Претендент на титул', bottomNote: `До финальной формы осталось ${30 - d} дн.` };
        return { stage: 6, mascot, title: mascot.olympiaTitle, bottomNote: '🔥 30 дней! Легендарная форма разблокирована!' };
      };

      window.calculateStreakStats = (historyByDate, frozenDates = [], todayKey) => {
        let streak = 0;
        for (let i = 0; i >= -365; i--) {
          const k = window.getLocalDateKey(i, todayKey);
          const dayObj = historyByDate[k];
          const hasItems = dayObj && Array.isArray(dayObj.items) && dayObj.items.length > 0;
          const isFrozen = Array.isArray(frozenDates) && frozenDates.includes(k);

          if (hasItems || isFrozen) {
            streak++;
          } else {
            if (i === 0) continue;
            break;
          }
        }
        const todayObj = historyByDate[todayKey];
        const todayDone = Boolean(
          (todayObj && Array.isArray(todayObj.items) && todayObj.items.length > 0) ||
          (Array.isArray(frozenDates) && frozenDates.includes(todayKey))
        );
        return { streak, todayDone };
      };

      window.formatHumanDateRu = (dateStr) => {
        const todayKey = window.getLocalDateKey(0);
        const yesterdayKey = window.getLocalDateKey(-1);
        const tomorrowKey = window.getLocalDateKey(1);

        const d = new Date(dateStr + 'T12:00:00');
        const dayMonth = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

        if (dateStr === todayKey) return `Сегодня, ${dayMonth}`;
        if (dateStr === yesterdayKey) return `Вчера, ${dayMonth}`;
        if (dateStr === tomorrowKey) return `Завтра, ${dayMonth}`;
        return dayMonth;

        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              if (width > maxSide || height > maxSide) {
                if (width > height) { height = Math.round((height * maxSide) / width); width = maxSide; }
                else { width = Math.round((width * maxSide) / height); height = maxSide; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve({ previewUrl: dataUrl, base64Data: dataUrl.split(',')[1] });
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);

          if (cacheKey && window.aiResponseCache.has(cacheKey)) {

          }
          const payload = {
            contents: [{ parts }],
            generationConfig: { responseMimeType: 'application/json', temperature: 0.1 }
          };
          let res;
          try {
            res = await fetch('/api/gemini', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          } catch (netErr) {
            throw new Error('Нет связи с сервером ИИ. Проверьте интернет и попробуйте ещё раз.');
          }
          let data = null;
          try { data = await res.json(); } catch (parseErr) { data = null; }
          if (!res.ok) {
            const msg = data?.error?.message || data?.error || `Ошибка сервера (${res.status})`;
            throw new Error(msg);
          }
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) throw new Error('ИИ не прислал ответ. Попробуйте еще раз.');
          const parsed = window.safeParseAiJson(text);

// Автоматический приём блюда из Telegram-бота по кнопке «Записать в Дневник»

        const updateCurrentDay = useCallback((updater) => {

          const tdee = Math.round(bmr * (Number(profile.activity) || 1.55));
          const mult = { cut_fast: 0.80, cut_soft: 0.88, maintain: 1.0, bulk_clean: 1.10, bulk_active: 1.18 }[profile.goal] || 1.0;
          const kcal = Math.round(tdee * mult);
          const p = Math.round(w * (Number(profile.proteinPerKg) || 2.0));
          const f = Math.round(w * (Number(profile.fatPerKg) || 1.0));
          const c = Math.round(Math.max(100, kcal - (p * 4 + f * 9)) / 4);
          const stepMl = appSettings.waterStepMl || 250;
          return { w, h: hVal, a, bmr, tdee, kcal, p, f, c, waterGlasses: Math.round((w * 33) / stepMl), waterTargetLiters: +((w * 33) / 1000).toFixed(2) };

        window.calculateNutriPulseScore = function (product) {
          const n = product?.nutriments || {};
          const get = (...keys) => { for (const key of keys) { const value = n[key]; if (value !== undefined && value !== null && value !== '' && Number.isFinite(Number(value))) return Number(value); } return null; };
          const energy = get('energy-kcal_100g') ?? (get('energy_100g') !== null ? get('energy_100g') / 4.184 : null);
          const sugar = get('sugars_100g');
          const sat = get('saturated-fat_100g');
          const sodium = get('sodium_100g') ?? (get('salt_100g') !== null ? get('salt_100g') / 2.5 : null);
          const fiber = get('fiber_100g');
          const protein = get('proteins_100g');
          const fruitVeg = get('fruits-vegetables-nuts-estimate-from-ingredients_100g');
          const available = [energy,sugar,sat,sodium,fiber,protein].filter(v => v !== null).length;
          if (available < 3) return null;
          let score = 100; const details = [];
          const penalty = (value, thresholds, maxPenalty, title, unit='г') => {
            if (value === null) return;
            const [good,bad] = thresholds;
            const amount = Math.max(0, Math.min(maxPenalty, (value-good)/(bad-good)*maxPenalty));
            if (amount > 1) { score -= amount; details.push({type:'negative', text:`${title}: ${Number(value.toFixed(1))} ${unit} на 100 г`}); }
          };
          penalty(energy,[80,500],12,'Энергетическая ценность','ккал');
          penalty(sugar,[5,22.5],16,'Сахара');
          penalty(sat,[1.5,5],12,'Насыщенные жиры');
          penalty(sodium,[120,900],16,'Натрий','мг');
          if (fiber !== null && fiber >= 3) { const bonus=Math.min(8,(fiber-3)*1.2); score+=bonus; details.push({type:'positive',text:`Источник пищевых волокон: ${fiber.toFixed(1)} г на 100 г`}); }
          if (protein !== null && protein >= 8) { const bonus=Math.min(5,(protein-8)*0.35); score+=bonus; details.push({type:'positive',text:`Содержит белок: ${protein.toFixed(1)} г на 100 г`}); }
          if (fruitVeg !== null && fruitVeg >= 40) { score+=Math.min(8,(fruitVeg-40)*0.13); details.push({type:'positive',text:`Фрукты, овощи и орехи: около ${Math.round(fruitVeg)}% состава`}); }
          const nova = Number(product.nova_group);
          if (nova >= 3 && nova <= 4) { score -= nova === 4 ? 14 : 7; details.push({type:'negative',text:`Группа обработки NOVA ${nova}: продукт относится к обработанным категориям`}); }
          const additiveCount = Number(product.additives_n);
          if (Number.isFinite(additiveCount) && additiveCount > 0) { score -= Math.min(8, additiveCount*1.5); details.push({type:'negative',text:`В базе указано пищевых добавок: ${additiveCount}`}); }
          if (details.length === 0) details.push({type:'neutral',text:'По доступным показателям выраженных отклонений не выявлено.'});
          score = Math.max(0,Math.min(100,Math.round(score)));
          const label = score >= 80 ? 'Сбалансированный состав' : score >= 60 ? 'В целом удачный состав' : score >= 40 ? 'Средняя оценка состава' : 'Есть показатели, на которые стоит обратить внимание';
